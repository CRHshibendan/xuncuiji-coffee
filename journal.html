<div>

<h2>记住的，是你喜欢的味道。</h2>
</div>
<button class="button primary" id="add-note">
<svg>
<use href="#i-plus"/>
</svg> 记下这一杯</button>
</div>
<div id="journal-list" class="journal-list">
</div>
<div class="journal-footer">
<svg>
<use href="#i-book"/>
</svg>
<span>每一杯都有自己的答案。手记仅保存在当前浏览器。</span>
<button id="export-notes">导出手记 ↗</button>

<dialog id="note-dialog">
<button class="close-dialog" aria-label="关闭">×</button>
<div class="eyebrow">ONE CUP, ONE MEMORY</div>
<h2>今天这杯，是什么味道？</h2>
<form id="note-form">
<label>咖啡豆 / 给这杯取个名字<input name="name" placeholder="例如：周末的第一杯" maxlength="60" required>
</label>
<div class="form-grid">
<label>咖啡粉（g）<input name="dose" type="number" min="1" max="100" step="0.1" required value="15">
</label>
<label>注水量（g）<input name="water" type="number" min="1" max="2000" required value="225">
</label>
<label>水温（°C）<input name="temp" type="number" min="1" max="100" required value="92">
</label>
</div>
<fieldset>
<legend>喝起来的感受</legend>
<div class="taste-options">
<label>
<input type="radio" name="taste" value="清甜平衡" checked>
<span>清甜平衡</span>
</label>
<label>
<input type="radio" name="taste" value="偏酸">
<span>有点酸</span>
</label>
<label>
<input type="radio" name="taste" value="偏苦">
<span>有点苦</span>
</label>
<label>
<input type="radio" name="taste" value="偏淡">
<span>有点淡</span>
</label>
</div>
</fieldset>
<p id="taste-advice" class="taste-advice">喜欢这杯？保留配方，下次试着复现它。</p>
<label>留给下一杯的话<textarea name="memo" rows="3" placeholder="闻到了什么？下次想做什么调整？" maxlength="500">
</textarea>
</label>
<button class="button primary" type="submit">保存这一杯 <svg>
<use href="#i-check"/>
</svg>
</button>
</form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite">
</div>
<svg class="icon-library" aria-hidden="true">
<defs>
<symbol id="i-check" viewBox="0 0 24 24">
<path d="m5 12 4 4L19 6"/>
</symbol>
<symbol id="i-book" viewBox="0 0 24 24">
<path d="M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2Zm0 0v16"/>
</symbol>
<symbol id="i-plus" viewBox="0 0 24 24">
<path d="M12 5v14M5 12h14"/>
</symbol>
</defs>
</svg>
